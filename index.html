
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroBlog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth" class="auth">
    <div class="logo">M</div>
    <h1>MicroBlog</h1>
    <p class="subtitle">Connect. Share. Follow.</p>

    <div id="login">
      <h2>Welcome Back!</h2>
      <input id="lu" placeholder="Username">
      <input id="lp" type="password" placeholder="Password">
      <button class="primary" onclick="signin()">Login</button>
      <p>New user? <a href="#" onclick="showRegister();return false;">Register</a></p>
    </div>

    <div id="register" class="hide">
      <h2>Create Account</h2>
      <input id="rn" placeholder="Your Name">
      <input id="ru" placeholder="Username">
      <input id="rp" type="password" placeholder="Password">
      <button class="primary" onclick="signup()">Register</button>
      <p>Already registered? <a href="#" onclick="showLogin();return false;">Login</a></p>
    </div>
  </div>

  <div id="app" class="hide">
    <header>
      <div class="brand"><span class="logo small">M</span> MicroBlog</div>
      <nav>
        <button onclick="home()">Home</button>
        <button onclick="showUsers()">Explore</button>
        <button onclick="showProfile()">Profile</button>
        <button onclick="logout()">Logout</button>
      </nav>
    </header>

    <main>
      <aside class="card sidebar">
        <div class="avatar" id="sideAvatar">U</div>
        <h3 id="sideName">User</h3>
        <p id="sideUsername">@user</p>
        <div class="stats">
          <span onclick="people('followers')">
            <b id="sideFollowers">0</b><br>Followers
          </span>
          <span onclick="people('following')">
            <b id="sideFollowing">0</b><br>Following
          </span>
        </div>
        <button class="outline" onclick="showProfile()">My Profile</button>
      </aside>

      <section id="page"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
